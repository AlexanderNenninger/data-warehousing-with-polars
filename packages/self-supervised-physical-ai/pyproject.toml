[project]
name = "self-supervised-physical-ai"
version = "0.1.0"
description = "Unsupervised representation learning for industrial sensor data (LeJEPA-style embeddings)"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.5.0",
    "numpy>=2.2.3",
    "polars>=1.30.0",
    "pydantic>=2.9.0",
    "scikit-learn>=1.5.0",
    "data-warehousing-with-polars",
]

[project.urls]
repository = "https://github.com/AlexanderNenninger/data-warehousing-with-polars"

[tool.uv.sources]
data-warehousing-with-polars = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
